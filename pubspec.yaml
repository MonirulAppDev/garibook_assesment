name: garibook_assesment
description: "Route & car navigation demo (Flutter + native location)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.0.2
  pretty_dio_logger: ^1.4.0
  logger: ^2.8.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1
  freezed: ^4.0.2
  injectable_generator: ^3.1.3
  http_mock_adapter: ^0.6.1

flutter:

  uses-material-design: true

  default-flavor: dev

  assets:
    - assets/config/
